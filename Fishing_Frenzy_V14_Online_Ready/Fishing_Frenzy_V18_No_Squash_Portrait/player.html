<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fishing Frenzy | Player</title><link rel="stylesheet" href="/shared.css?v=5fish"><link rel="stylesheet" href="/player-screen.css?v=15"><div class="shell"><header class="top"><div class="logo">🎣 FISHING FRENZY</div><div class="pill" id="identity">🧑‍🎣 PLAYER</div></header><section id="join" class="panel setup"><h1>🚢 Join the Crew!</h1><input id="pinInput" inputmode="numeric" maxlength="6" placeholder="6-digit room PIN"><input id="nameInput" maxlength="18" placeholder="Your name"><br><button id="joinBtn" class="primary">JUMP ON BOARD ➜</button><p id="error"></p></section><div id="game" class="hidden"><div class="play-layout"><div class="play-top"><div class="pill" id="room">ROOM</div><div class="status" id="status">Welcome aboard!</div></div><div class="play-area"><aside class="skill-side" id="playing"><div class="side-heading">⚡ SKILLS</div><div class="controls"><button class="power" data-power="break"><span class="sym">✂️</span>BREAK LINE</button><button class="power" data-power="tangle"><span class="sym">🌀</span>TANGLE</button><button class="power" data-power="escape"><span class="sym">🪝</span>ESCAPE</button><button class="power" data-power="secure"><span class="sym">🔒</span>SECURE 10s</button></div></aside><main class="stage"><div class="game-clock hidden" id="timer">⏳ 30s</div><div class="welcome-overlay"><div class="welcome-title">WELCOME ABOARD!</div><div class="welcome-sub">Waiting for the captain to sail...</div></div><canvas id="world" aria-label="Tap a creature to catch A B C or D"></canvas><div class="tag" id="phase">Waiting for teacher...</div></main></div></div></div></div><div class="overlay hidden" id="reveal"><div class="modal"><div style="font-size:45px">🎉 ✨ 🎊</div><h2>ROUND COMPLETE!</h2><div class="answer" id="answer"></div><h2 id="result"></h2><p id="resultmsg"></p><p>Waiting for teacher to start the next question...</p></div></div><script src="/art.js?v=16"></script><script src="/audio.js"></script><script>
const $=x=>document.getElementById(x);let code='',id='',name='',s={phase:'lobby',players:[]},last='',ev,drawPhase='lobby';const abc='ABCD';async function api(route,data){let r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.error);return d}function me(){return s.players.find(p=>p.id===id)}function confetti(){for(let i=0;i<45;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['🎊','⭐','✨'][i%3];e.style.left=Math.random()*100+'vw';document.body.append(e);setTimeout(()=>e.remove(),3500)}}function render(next){s=next;document.querySelector('.stage').dataset.phase=s.phase;let p=me();$('identity').textContent='🧑‍🎣 '+name;$('room').textContent='ROOM '+code;$('timer').textContent='⏳ '+s.remaining+'s';$('timer').classList.toggle('hidden',s.phase!=='play');document.querySelector('.play-top').classList.toggle('during-play',s.phase==='play');$('phase').textContent={lobby:'⚓ CREW BOARDING',play:'🎣 CATCH & PROTECT!',reveal:'🎉 ROUND OVER',end:'🏁 VOYAGE FINISHED'}[s.phase];document.querySelectorAll('.power').forEach(b=>b.disabled=s.phase!=='play');$('status').textContent=s.phase==='lobby'?'🚢 You are on the boat! Waiting for teacher to press START.':s.phase==='play'?(p?.choice===null?'🐟 Catch a fish!':`🎣 Holding ${abc[p.choice]}! `+(p.securedUntil>Date.now()?'🔒 SECURED':'Protect it or change your catch!')):s.phase==='end'?'🎉 Game over! Thank you for playing!':'🎊 Round completed!';if(s.phase==='play'&&last!=='play')document.querySelectorAll('.power').forEach(b=>b.classList.remove('used'));if(s.phase==='reveal'){$('reveal').classList.remove('hidden');$('answer').textContent=s.answer.letter+' — '+s.answer.text;let correct=p?.choice===abc.indexOf(s.answer.letter);$('result').textContent=correct?'✅ +100 POINTS!':'❌ +0 POINTS';$('resultmsg').textContent=correct?'Excellent catch!':'Try again next round!';if(last!=='reveal'){confetti();FFSound('win')}}else $('reveal').classList.add('hidden');if(last!==s.phase){drawPhase=s.phase;let old=$('world'),n=old.cloneNode();old.replaceWith(n);draw()}last=s.phase}function draw(){let arr=new Proxy([],{get(t,p){if(p==='length')return s.players.length;if(p==='slice')return(...a)=>s.players.slice(...a);return Reflect.get(t,p)}});FFArt.draw($('world'),arr,drawPhase,0,()=>me()?.choice??null,async choice=>{if(s.phase!=='play')return;try{await api('catch',{code,id,choice});FFSound('catch')}catch(e){$('status').textContent='⚠️ '+e.message}})}function listen(){ev?.close();ev=new EventSource('/events?code='+code);ev.onmessage=e=>render(JSON.parse(e.data))}async function join(){try{code=$('pinInput').value.trim();name=$('nameInput').value.trim();if(!name||!/^[0-9]{6}$/.test(code))throw Error('Enter your name and a 6-digit PIN');let d=await api('join',{code,name});id=d.id;sessionStorage.setItem('ffplayer',JSON.stringify({code,name,id}));$('join').classList.add('hidden');$('game').classList.remove('hidden');draw();listen()}catch(e){$('error').textContent=e.message}}$('joinBtn').onclick=join;document.querySelectorAll('.power').forEach(b=>b.onclick=async()=>{if(s.phase!=='play')return;try{await api('power',{code,id,power:b.dataset.power});b.classList.add('used');FFSound('catch')}catch(e){$('status').textContent='⚠️ '+e.message}});try{let d=JSON.parse(sessionStorage.getItem('ffplayer'));if(d){code=d.code;name=d.name;id=d.id;$('join').classList.add('hidden');$('game').classList.remove('hidden');draw();listen()}}catch{};
</script></html>
